[project]
name = "kpp-scraper"
version = "0.1.0"
description = "Scrapes official hobby paint color data (Mr. Color, Tamiya, Gaia) into data/paints.json"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pillow>=11.0",
    "pypdf>=5.0",
    "fonttools>=4.50",
]

[project.scripts]
kpp-build = "kpp_scraper.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpp_scraper"]
